  /api/webhooks/create:
    post:
      operationId: webhooksCreate
      summary: Create a Webhook. Requires 'Administer' permission on the specified project.
      description: Create a Webhook. Requires 'Administer' permission on the specified project.
      tags:
      - webhooks
      parameters:
      - name: name
        in: query
        description: Name displayed in the administration console of webhooks
        required: true
        schema:
          type: string
          maxLength: 100
        example: My Webhook
      - name: organization
        in: query
        description: The key of the organization that will own the webhook
        required: true
        schema:
          type: string
          maxLength: 255
        example: my-org
      - name: project
        in: query
        description: The key of the project that will own the webhook
        required: false
        schema:
          type: string
          maxLength: 100
        example: my_project
      - name: secret
        in: query
        description: If provided, secret will be used as the key to generate the HMAC hex (lowercase)
          digest value in the 'X-Sonar-Webhook-HMAC-SHA256' header
        required: false
        schema:
          type: string
          maxLength: 200
        example: your_secret
      - name: url
        in: query
        description: 'Server endpoint that will receive the webhook payload, for example ''http://my_server/foo''.
          If HTTP Basic authentication is used, HTTPS is recommended to avoid man in the middle attacks.
          Example: ''https://myLogin:myPassword@my_server/foo'''
        required: true
        schema:
          type: string
          maxLength: 512
        example: https://www.google.com/sonar
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized - authentication required
        '403':
          description: Insufficient privileges
        '404':
          description: Not Found
