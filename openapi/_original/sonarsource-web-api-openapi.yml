  /api/issues/search:
    get:
      operationId: issuesSearch
      summary: Search for issues. Requires the 'Browse' permission on the specified project(s).
      description: Search for issues. Requires the 'Browse' permission on the specified project(s).
      tags:
      - issues
      parameters:
      - name: additionalFields
        in: query
        description: Comma-separated list of the optional fields to be returned in response. Action plans
          are dropped in 5.5, it is not returned in the response.
        required: false
        schema:
          type: string
          enum:
          - _all
          - comments
          - languages
          - actionPlans
          - rules
          - ruleDescriptionContextKey
          - transitions
          - actions
          - users
      - name: asc
        in: query
        description: Ascending sort
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          - 'yes'
          - 'no'
          default: 'true'
      - name: assigned
        in: query
        description: To retrieve assigned or unassigned issues
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          - 'yes'
          - 'no'
      - name: assignees
        in: query
        description: Comma-separated list of assignee logins. The value '__me__' can be used as a placeholder
          for user who performs the request
        required: false
        schema:
          type: string
        example: admin,usera,__me__
      - name: author
        in: query
        description: SCM accounts. To set several values, the parameter must be called once for each value.
        required: false
        schema:
          type: string
        example: author=torvalds@linux-foundation.org&author=linux@fondation.org
      - name: branch
        in: query
        description: Branch key
        required: false
        schema:
          type: string
        example: feature/my_branch
      - name: cleanCodeAttributeCategories
        in: query
        description: Comma-separated list of clean code attribute categories.
        required: false
        schema:
          type: string
          enum:
          - ADAPTABLE
          - CONSISTENT
          - INTENTIONAL
          - RESPONSIBLE
        example: ADAPTABLE,INTENTIONAL
      - name: complianceStandards
        in: query
        description: Set of compliance standards to filter on. Categories within a standard are comma-separated
          and behave as an 'or'. Multiple standards are separated by an ampersand and behave as an 'and'.
        required: false
        schema:
          type: string
        example: owasp_asvs:urn:sonar-security-standard:owasp:asvs:5.0=15,16&sonar_standard:urn:sonar-security-standard:sonar:standard:unversioned=log-injection
      - name: componentKeys
        in: query
        description: Comma-separated list of component keys. Retrieve issues associated to a specific
          list of components (and all its descendants). A component can be a project, directory or file.
        required: false
        schema:
          type: string
        example: my_project
      - name: createdAfter
        in: query
        description: To retrieve issues created after the given date (inclusive). Either a date (server
          timezone) or datetime can be provided. If this parameter is set, createdSince must not be set
        required: false
        schema:
          type: string
        example: 2017-10-19 or 2017-10-19T13:00:00+0200
      - name: createdAt
        in: query
        description: Datetime to retrieve issues created during a specific analysis
        required: false
        schema:
          type: string
        example: 2017-10-19T13:00:00+0200
      - name: createdBefore
        in: query
        description: To retrieve issues created before the given date (inclusive). Either a date (server
          timezone) or datetime can be provided.
        required: false
        schema:
          type: string
        example: 2017-10-19 or 2017-10-19T13:00:00+0200
      - name: createdInLast
        in: query
        description: To retrieve issues created during a time span before the current time (exclusive).
          Accepted units are 'y' for year, 'm' for month, 'w' for week and 'd' for day. If this parameter
          is set, createdAfter must not be set
        required: false
        schema:
          type: string
        example: 1m2w (1 month 2 weeks)
      - name: cwe
        in: query
        description: Comma-separated list of CWE identifiers. Use 'unknown' to select issues not associated
          to any CWE.
        required: false
        schema:
          type: string
        example: 12,125,unknown
      - name: facetMode
        in: query
        description: Choose the returned value for facet items, either count of issues or sum of remediation
          effort.
        required: false
        schema:
          type: string
          enum:
          - count
          - effort
          default: count
      - name: facets
        in: query
        description: Comma-separated list of the facets to be computed. No facet is computed by default.
        required: false
        schema:
          type: string
          enum:
          - projects
          - moduleUuids
          - fileUuids
          - assigned_to_me
          - severities
          - statuses
          - issueStatuses
          - resolutions
          - rules
          - assignees
          - author
          - directories
          - languages
          - tags
          - types
          - owaspMobileTop10-2024
          - owaspTop10
          - owaspTop10-2021
          - cwe
          - createdAt
          - sonarsourceSecurity
          - impactSoftwareQualities
          - impactSeverities
          - cleanCodeAttributeCategories
          - complianceStandards
      - name: impactSeverities
        in: query
        description: Comma-separated list of impact severities.
        required: false
        schema:
          type: string
          enum:
          - INFO
          - LOW
          - MEDIUM
          - HIGH
          - BLOCKER
        example: HIGH,LOW
      - name: impactSoftwareQualities
        in: query
        description: Comma-separated list of software qualities.
        required: false
        schema:
          type: string
          enum:
          - MAINTAINABILITY
          - RELIABILITY
          - SECURITY
        example: MAINTAINABILITY,RELIABILITY
      - name: issueStatuses
        in: query
        description: Comma-separated list of issue statuses
        required: false
        schema:
          type: string
          enum:
          - OPEN
          - CONFIRMED
          - FALSE_POSITIVE
          - ACCEPTED
          - FIXED
        example: OPEN,ACCEPTED
      - name: issues
        in: query
        description: Comma-separated list of issue keys
        required: false
        schema:
          type: string
        example: 5bccd6e8-f525-43a2-8d76-fcb13dde79ef
      - name: languages
        in: query
        description: Comma-separated list of languages. Available since 4.4
        required: false
        schema:
          type: string
        example: java,js
      - name: onComponentOnly
        in: query
        description: Return only issues at a component's level, not on its descendants (modules, directories,
          files, etc). This parameter is only considered when componentKeys or componentUuids is set.
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          - 'yes'
          - 'no'
          default: 'false'
      - name: organization
        in: query
        description: Organization key
        required: false
        schema:
          type: string
        example: my-org
      - name: owaspMobileTop10-2024
        in: query
        description: Comma-separated list of OWASP Mobile Top 10 - 2024 lowercase categories.
        required: false
        schema:
          type: string
          enum:
          - m1
          - m2
          - m3
          - m4
          - m5
          - m6
          - m7
          - m8
          - m9
          - m10
      - name: owaspTop10
        in: query
        description: Comma-separated list of OWASP Top 10 lowercase categories.
        required: false
        schema:
          type: string
          enum:
          - a1
          - a2
          - a3
          - a4
          - a5
          - a6
          - a7
          - a8
          - a9
          - a10
      - name: owaspTop10-2021
        in: query
        description: Comma-separated list of OWASP Top 10 - 2021 lowercase categories.
        required: false
        schema:
          type: string
          enum:
          - a1
          - a2
          - a3
          - a4
          - a5
          - a6
          - a7
          - a8
          - a9
          - a10
      - name: p
        in: query
        description: 1-based page number
        required: false
        schema:
          type: string
          default: '1'
        example: '42'
      - name: ps
        in: query
        description: Page size. Must be greater than 0 and less or equal than 500
        required: false
        schema:
          type: string
          default: '50'
        example: '20'
      - name: pullRequest
        in: query
        description: Pull request id
        required: false
        schema:
          type: string
        example: '5461'
      - name: resolutions
        in: query
        description: Comma-separated list of resolutions
        required: false
        schema:
          type: string
          enum:
          - FALSE-POSITIVE
          - WONTFIX
          - FIXED
          - REMOVED
        example: FIXED,REMOVED
      - name: resolved
        in: query
        description: To match resolved or unresolved issues
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          - 'yes'
          - 'no'
      - name: rules
        in: query
        description: Comma-separated list of coding rule keys. Format is <repository>:<rule>
        required: false
        schema:
          type: string
        example: squid:AvoidCycles
      - name: s
        in: query
        description: Sort field
        required: false
        schema:
          type: string
          enum:
          - STATUS
          - UPDATE_DATE
          - CLOSE_DATE
          - HOTSPOTS
          - FILE_LINE
          - SEVERITY
          - CREATION_DATE
          - ASSIGNEE
      - name: severities
        in: query
        description: Comma-separated list of severities
        required: false
        schema:
          type: string
          enum:
          - INFO
          - MINOR
          - MAJOR
          - CRITICAL
          - BLOCKER
        example: BLOCKER,CRITICAL
      - name: sinceLeakPeriod
        in: query
        description: To retrieve issues created since the leak period. If this parameter is set to a truthy
          value, createdAfter must not be set and one component id or key must be provided.
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          - 'yes'
          - 'no'
          default: 'false'
      - name: sonarsourceSecurity
        in: query
        description: Comma-separated list of SonarSource security categories. Use 'others' to select issues
          not associated with any category
        required: false
        schema:
          type: string
          enum:
          - buffer-overflow
          - permission
          - sql-injection
          - command-injection
          - path-traversal-injection
          - ldap-injection
          - xpath-injection
          - rce
          - dos
          - ssrf
          - csrf
          - xss
          - log-injection
          - http-response-splitting
          - open-redirect
          - xxe
          - object-injection
          - weak-cryptography
          - auth
          - insecure-conf
          - encrypt-data
          - traceability
          - file-manipulation
          - others
      - name: statuses
        in: query
        description: Comma-separated list of statuses
        required: false
        schema:
          type: string
          enum:
          - OPEN
          - CONFIRMED
          - REOPENED
          - RESOLVED
          - CLOSED
        example: OPEN,REOPENED
      - name: tags
        in: query
        description: Comma-separated list of tags.
        required: false
        schema:
          type: string
        example: security,convention
      - name: types
        in: query
        description: Comma-separated list of types.
        required: false
        schema:
          type: string
          enum:
          - CODE_SMELL
          - BUG
          - VULNERABILITY
        example: CODE_SMELL,BUG
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized - authentication required
        '403':
          description: Insufficient privileges
        '404':
          description: Not Found
