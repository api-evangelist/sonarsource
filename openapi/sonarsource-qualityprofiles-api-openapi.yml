  /api/qualityprofiles/changelog:
    get:
      operationId: qualityprofilesChangelog
      summary: 'Get the history of changes on a quality profile: rule activation/deactivation, change in parameters/severity. Events ...'
      description: 'Get the history of changes on a quality profile: rule activation/deactivation, change in parameters/severity. Events are ordered by date in descending order (most recent first).'
      tags:
      - qualityprofiles
      parameters:
      - name: key
        in: query
        description: Quality profile key. Mandatory unless 'qualityProfile' and 'language' are specified.
        required: false
        schema:
          type: string
        example: AU-Tpxb--iU5OvuD2FLy
      - name: language
        in: query
        description: Quality profile language. Mandatory if 'key' is not set.
        required: false
        schema:
          type: string
          enum:
          - kubernetes
          - css
          - py
          - plsql
          - apex
          - java
          - xml
          - powershell
          - ipynb
          - text
          - azurepipelines
          - yaml
          - swift
          - cpp
          - vb
          - secrets
          - groovy
          - shell
