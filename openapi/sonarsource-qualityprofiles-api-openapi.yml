      - name: active_severities
        in: query
        description: Comma-separated list of activation severities, i.e the severity of rules in Quality profiles.
        required: false
        schema:
          type: string
          enum:
          - INFO
          - MINOR
          - MAJOR
          - CRITICAL
          - BLOCKER
        example: CRITICAL,BLOCKER
      - name: asc
        in: query
        description: Ascending sort
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          - 'yes'
          - 'no'
          default: 'true'
      - name: available_since
        in: query
        description: Filters rules added since date. Format is yyyy-MM-dd
        required: false
        schema:
          type: string
        example: '2014-06-22'
      - name: cleanCodeAttributeCategories
        in: query
        description: Comma-separated list of Clean Code Attribute Categories
        required: false
        schema:
          type: string
          enum:
          - ADAPTABLE
          - CONSISTENT
          - INTENTIONAL
          - RESPONSIBLE
        example: ADAPTABLE,INTENTIONAL
      - name: cwe
        in: query
        description: Comma-separated list of CWE identifiers. Use 'unknown' to select rules not associated to any CWE.
        required: false
        schema:
          type: string
        example: 12,125,unknown
      - name: impactSeverities
        in: query
        description: Comma-separated list of Software Quality Severities
        required: false
        schema:
          type: string
          enum:
          - INFO
          - LOW
          - MEDIUM
          - HIGH
          - BLOCKER
        example: HIGH,MEDIUM
      - name: impactSoftwareQualities
        in: query
        description: Comma-separated list of Software Qualities
        required: false
        schema:
          type: string
          enum:
          - MAINTAINABILITY
          - RELIABILITY
          - SECURITY
        example: MAINTAINABILITY,RELIABILITY
      - name: inheritance
        in: query
        description: Comma-separated list of values of inheritance for a rule within a quality profile. Used only if the parameter 'activation' is set.
        required: false
        schema:
          type: string
          enum:
          - NONE
          - INHERITED
          - OVERRIDES
        example: INHERITED,OVERRIDES
      - name: is_template
        in: query
        description: Filter template rules
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          - 'yes'
          - 'no'
      - name: languages
        in: query
        description: Comma-separated list of languages
        required: false
        schema:
          type: string
        example: java,js
      - name: organization
        in: query
        description: Organization key
        required: false
        schema:
          type: string
        example: my-org
      - name: owaspMobileTop10-2024
        in: query
        description: Comma-separated list of OWASP Mobile Top 10 (2024) lowercase categories.
        required: false
        schema:
          type: string
          enum:
          - m1
          - m2
          - m3
          - m4
          - m5
          - m6
          - m7
          - m8
          - m9
          - m10
      - name: owaspTop10
        in: query
        description: Comma-separated list of OWASP Top 10 lowercase categories.
        required: false
        schema:
          type: string
          enum:
          - a1
          - a2
          - a3
          - a4
          - a5
          - a6
          - a7
          - a8
          - a9
          - a10
      - name: owaspTop10-2021
        in: query
        description: Comma-separated list of OWASP Top 10 (2021) lowercase categories.
        required: false
        schema:
          type: string
          enum:
          - a1
          - a2
          - a3
          - a4
          - a5
          - a6
          - a7
          - a8
          - a9
          - a10
      - name: q
        in: query
        description: UTF-8 search query
        required: false
        schema:
          type: string
        example: xpath
      - name: qprofile
        in: query
        description: Quality profile key to filter on. Used only if the parameter 'activation' is set.
        required: false
        schema:
          type: string
        example: AU-Tpxb--iU5OvuD2FLy
      - name: repositories
        in: query
        description: Comma-separated list of repositories
        required: false
        schema:
          type: string
        example: checkstyle,findbugs
      - name: rule_key
        in: query
        description: Key of rule to search for
        required: false
        schema:
          type: string
        example: squid:S001
      - name: rule_keys
        in: query
        description: Comma-separated list of rule keys to deactivate. When provided, other search filter parameters are ignored.
        required: false
        schema:
          type: string
        example: squid:AvoidCycles,java:S1234
      - name: s
        in: query
        description: Sort field
        required: false
        schema:
          type: string
          enum:
          - name
          - updatedAt
          - createdAt
          - key
        example: name
      - name: severities
        in: query
        description: Comma-separated list of default severities. Not the same than severity of rules in Quality profiles.
        required: false
        schema:
          type: string
          enum:
          - INFO
          - MINOR
          - MAJOR
          - CRITICAL
          - BLOCKER
        example: CRITICAL,BLOCKER
      - name: sonarsourceSecurity
        in: query
        description: Comma-separated list of SonarSource security categories. Use 'others' to select rules not associated with any category
        required: false
        schema:
          type: string
          enum:
          - buffer-overflow
          - permission
          - sql-injection
          - command-injection
          - path-traversal-injection
          - ldap-injection
          - xpath-injection
          - rce
          - dos
          - ssrf
          - csrf
          - xss
          - log-injection
          - http-response-splitting
          - open-redirect
          - xxe
          - object-injection
          - weak-cryptography
          - auth
          - insecure-conf
          - encrypt-data
          - traceability
          - file-manipulation
          - others
        example: sql-injection,command-injection,others
      - name: statuses
        in: query
        description: Comma-separated list of status codes
        required: false
        schema:
          type: string
          enum:
          - BETA
          - DEPRECATED
          - READY
          - REMOVED
        example: READY
      - name: tags
        in: query
        description: Comma-separated list of tags. Returned rules match any of the tags (OR operator)
        required: false
        schema:
          type: string
        example: security,java8
      - name: targetKey
        in: query
        description: Quality Profile key on which the rule deactivation is done. To retrieve a profile key please see api/qualityprofiles/search
        required: true
        schema:
          type: string
        example: AU-TpxcA-iU5OvuD2FL1
      - name: template_key
        in: query
        description: Key of the template rule to filter on. Used to search for the custom rules based on this template.
        required: false
        schema:
          type: string
        example: java:S001
      - name: types
        in: query
        description: Comma-separated list of types. Returned rules match any of the tags (OR operator)
        required: false
        schema:
          type: string
          enum:
          - CODE_SMELL
          - BUG
          - VULNERABILITY
          - SECURITY_HOTSPOT
        example: BUG
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized - authentication required
        '403':
          description: Insufficient privileges
        '404':
          description: Not Found
