          - ansible
          - dart
          - rust
          - jcl
          - web
          - flex
          - json
          - vbnet
          - postgres
          - cloudformation
          - c
          - go
          - kotlin
          - rpg
          - pli
          - tsql
          - ruby
          - cs
          - cobol
          - php
          - gosu
          - objc
          - githubactions
          - ts
      - name: organization
        in: query
        description: Organization key.
        required: false
        schema:
          type: string
        example: my-org
      - name: p
        in: query
        description: 1-based page number
        required: false
        schema:
          type: string
          default: '1'
        example: '42'
      - name: ps
        in: query
        description: Page size. Must be greater than 0 and less or equal than 500
        required: false
        schema:
          type: string
          default: '50'
        example: '20'
      - name: qualityProfile
        in: query
        description: Quality profile name. Mandatory if 'key' is not set.
        required: false
        schema:
          type: string
        example: Sonar way
      - name: since
        in: query
        description: Start date for the changelog. Either a date (server timezone) or datetime can be provided.
        required: false
        schema:
          type: string
        example: 2017-10-19 or 2017-10-19T13:00:00+0200
      - name: to
        in: query
        description: End date for the changelog. Either a date (server timezone) or datetime can be provided.
        required: false
        schema:
          type: string
        example: 2017-10-19 or 2017-10-19T13:00:00+0200
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized - authentication required
        '403':
          description: Insufficient privileges
        '404':
          description: Not Found
