aid: sonarsource
name: SonarSource
description: >-
  SonarSource (Sonar) builds the industry-standard tooling for code quality and code
  security, trusted by large engineering organizations to keep code Clean. Its product
  line spans SonarQube Cloud (formerly SonarCloud, the hosted SaaS analysis service),
  SonarQube Server (self-managed), SonarQube for IDE (formerly SonarLint), and the
  SonarQube Community Build. SonarQube Cloud exposes a REST Web API for programmatically
  managing projects, issues, quality gates, quality profiles, rules, measures, hotspots,
  permissions, webhooks, and user tokens, plus a family of first-party scanners (npm,
  PyPI, Maven, Gradle, .NET, and Docker) for wiring analysis into CI/CD pipelines.
url: https://raw.githubusercontent.com/api-evangelist/sonarsource/refs/heads/main/apis.yml
